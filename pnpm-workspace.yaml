packages:
  - "apps/*"
  - "packages/*"

# Build-script approvals (pnpm v11.9+). Native deps we rely on: true.
# Optional native accelerators with pure-JS fallbacks (testcontainers→ssh2 chain): false.
allowBuilds:
  esbuild: true
  "@biomejs/biome": true
  "@node-rs/argon2": true
  sharp: true
  cpu-features: false
  protobufjs: false
  ssh2: false
  core-js: false

# `pnpm audit` ignores — the ONLY remaining high advisories are undici <6.24/6.27 pulled by
# @testcontainers/postgresql (integration-test infra only). undici is at 5.29.0; the fix is a
# breaking 6.x bump on test infra, and it is NEVER in the pruned prod image. Non-exploitable here
# (testcontainers talks to the LOCAL trusted Docker daemon, not attacker input). See docs/adr/.
auditConfig:
  ignoreGhsas:
    - GHSA-v9p9-hfj2-hcw8
    - GHSA-vrm6-8vpv-qv8q
    - GHSA-vxpw-j846-p89q

# Minimum versions for transitive dependencies with known advisories (pnpm audit).
overrides:
  "drizzle-orm": ">=0.45.2"
  "@grpc/grpc-js@>=1.14.0 <1.14.5": "^1.14.5"
  "brace-expansion@>=2.0.0 <2.1.6": "^2.1.6"
  "brace-expansion@>=3.0.0 <5.0.11": "^5.0.11"
  "browserslist@<4.28.7": "^4.28.7"
  "linkify-it@<5.0.2": "^5.0.2"
  "nanoid@<3.3.18": "^3.3.18"
  "postcss@<8.5.18": "^8.5.18"
  "smol-toml@<1.7.1": "^1.7.1"
