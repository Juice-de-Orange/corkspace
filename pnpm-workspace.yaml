packages:
  - "apps/*"
  - "packages/*"

# Build-script approvals (pnpm v11.9+). Native deps we rely on: true.
# Optional native accelerators with pure-JS fallbacks (testcontainers→ssh2 chain): false.
allowBuilds:
  esbuild: true
  "@biomejs/biome": true
  "@node-rs/argon2": true
  sharp: true
  cpu-features: false
  protobufjs: false
  ssh2: false
  core-js: false

# Minimum versions for transitive dependencies with known advisories (pnpm audit).
overrides:
  "drizzle-orm": ">=0.45.2"
  "@grpc/grpc-js@>=1.14.0 <1.14.5": "^1.14.5"
  "brace-expansion@>=2.0.0 <2.1.6": "^2.1.6"
  "brace-expansion@>=3.0.0 <5.0.11": "^5.0.11"
  "browserslist@<4.28.7": "^4.28.7"
  # @esbuild-kit/core-utils (drizzle-kit's loader) pins esbuild 0.18 and tsup 8.5 asks for ^0.27, both
  # below the fixes for GHSA-67mh-4wv8-2f99 and GHSA-g7r4-m6w7-qqqr (db:generate and build tooling).
  # Scoped to the parents: a plain `esbuild@<range>` selector also rewrites bundle-require's peer range.
  "@esbuild-kit/core-utils>esbuild": "^0.25.0"
  "tsup>esbuild": "^0.28.1"
  # GHSA-834v-8h66-3h79 (high): happy-dom is a peer of vitest and of @tiptap/html (its Node build renders
  # with it; browsers use the DOM). @tiptap/html asks for ^20.8.9; the 21.0 major only turns CSS and
  # iframe loading off by default.
  "happy-dom@<21.0.4": "^21.0.4"
  "linkify-it@<5.0.2": "^5.0.2"
  "nanoid@<3.3.18": "^3.3.18"
  "postcss@<8.5.18": "^8.5.18"
  # protobufjs and uuid come from dockerode 4 under @testcontainers/postgresql (test infra only).
  "protobufjs@>=7.5.0 <7.6.5": "^7.6.5"
  "smol-toml@<1.7.1": "^1.7.1"
  # GHSA-68fv-2mgg-jv7q (high, fails `pnpm audit`): postcss under vite pins source-map-js ^1.2.1.
  "source-map-js@<1.2.2": "^1.2.2"
  "uuid@<11.1.1": "^11.1.1"
