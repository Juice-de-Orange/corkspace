server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # --- Security headers (Phase 7 hardening) ---
  # style-src allows 'unsafe-inline' because the app uses React inline styles + style attributes
  # heavily (no inline <script>, so script-src stays strict 'self'). img-src is 'self' data' only —
  # link-card OpenGraph images are downloaded server-side (SSRF-safe) and served same-origin from
  # /api/assets, so NO remote image hosts are needed and third-party hotlink tracking is impossible.
  # frame-src is restricted to exactly the YouTube (no-cookie) + Vimeo embed hosts — the only allowed
  # iframes (video embeds); nothing else can be framed.
  add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'self'; frame-src https://www.youtube-nocookie.com https://player.vimeo.com; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy strict-origin-when-cross-origin always;
  add_header X-Frame-Options DENY always;
  add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
  add_header Permissions-Policy "geolocation=(), microphone=(), camera=(), interest-cohort=()" always;

  # Docker's embedded DNS, so the api upstream is re-resolved (a `proxy_pass` with a variable
  # forces per-request resolution) — otherwise nginx caches the api IP at startup and 502s after
  # an api container restart (e.g. a restore).
  resolver 127.0.0.11 valid=10s ipv6=off;

  # API → Hono service.
  location /api/ {
    # allow image uploads + feedback screenshots (base64 data URLs)
    client_max_body_size 12m;
    set $api_upstream http://api:3000;
    proxy_pass $api_upstream;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # Built frontend bundle (Vite, content-hashed) lives under /static/ in the image root, served
  # with a long immutable cache. (It was /assets/ before, but the CDN had cached year-long 404s
  # there from an earlier misconfig — /static/ is a fresh, conflict-free path.) Uploaded images
  # are served by the API at /api/assets/<id>, NOT statically.
  location /static/ {
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    add_header X-Content-Type-Options nosniff always;
    try_files $uri =404;
  }

  # SPA fallback.
  location / {
    try_files $uri $uri/ /index.html;
  }
}
