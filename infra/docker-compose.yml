name: corkspace

# Shared app env for the Node services. DATABASE_URL is composed from POSTGRES_* and
# the in-network `db` host so it always points at the compose Postgres.
x-app-env: &app-env
  DATABASE_URL: postgres://${POSTGRES_USER:-corkspace}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@db:5432/${POSTGRES_DB:-corkspace}
  BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET}
  BETTER_AUTH_URL: ${BETTER_AUTH_URL}
  AUTH_TRUSTED_ORIGINS: ${AUTH_TRUSTED_ORIGINS}
  ADMIN_EMAIL: ${ADMIN_EMAIL}
  ADMIN_PASSWORD: ${ADMIN_PASSWORD}
  ADMIN_NAME: ${ADMIN_NAME:-Admin}
  ASSET_DIR: /data/assets

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-corkspace}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-corkspace}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-corkspace} -d ${POSTGRES_DB:-corkspace}"]
      interval: 5s
      timeout: 5s
      retries: 12

  migrate:
    build:
      context: ..
      dockerfile: infra/Dockerfile.node
    command: ["pnpm", "--filter", "@corkspace/db", "exec", "tsx", "src/migrate-cli.ts"]
    environment: *app-env
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  api:
    build:
      context: ..
      dockerfile: infra/Dockerfile.node
    command: ["pnpm", "--filter", "@corkspace/api", "exec", "tsx", "src/index.ts"]
    environment:
      <<: *app-env
      NODE_ENV: production
      API_PORT: "3000"
    volumes:
      - assets:/data/assets
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    expose:
      - "3000"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000/api/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  worker:
    build:
      context: ..
      dockerfile: infra/Dockerfile.node
    command: ["pnpm", "--filter", "@corkspace/worker", "exec", "tsx", "src/index.ts"]
    environment:
      <<: *app-env
      NODE_ENV: production
    volumes:
      - assets:/data/assets
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

  web:
    build:
      context: ..
      dockerfile: infra/Dockerfile.web
    depends_on:
      - api
    ports:
      - "${WEB_PORT:-8080}:80"
    volumes:
      - assets:/data/assets:ro
    restart: unless-stopped

volumes:
  pgdata:
  assets:
