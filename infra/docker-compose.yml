name: corkspace

# Images: `docker compose up -d` pulls the released images from GHCR (CORKSPACE_VERSION, default
# latest) and builds them from this checkout only when they cannot be pulled; `--build` always
# builds from source.

# Shared app env for the Node services. DATABASE_URL is composed from POSTGRES_* and
# the in-network `db` host so it always points at the compose Postgres.
x-app-env: &app-env
  DATABASE_URL: postgres://${POSTGRES_USER:-corkspace}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@db:5432/${POSTGRES_DB:-corkspace}
  BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET}
  BETTER_AUTH_URL: ${BETTER_AUTH_URL}
  AUTH_TRUSTED_ORIGINS: ${AUTH_TRUSTED_ORIGINS}
  ADMIN_EMAIL: ${ADMIN_EMAIL}
  ADMIN_PASSWORD: ${ADMIN_PASSWORD}
  ADMIN_NAME: ${ADMIN_NAME:-Admin}
  BRAND_NAME: ${BRAND_NAME:-Corkspace}
  ASSET_DIR: /data/assets

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-corkspace}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-corkspace}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-corkspace} -d ${POSTGRES_DB:-corkspace}"]
      interval: 5s
      timeout: 5s
      retries: 12

  migrate:
    image: ghcr.io/juice-de-orange/corkspace-api:${CORKSPACE_VERSION:-latest}
    build:
      context: ..
      dockerfile: infra/Dockerfile.node
    command: ["pnpm", "--filter", "@corkspace/db", "exec", "tsx", "src/migrate-cli.ts"]
    environment: *app-env
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  api:
    image: ghcr.io/juice-de-orange/corkspace-api:${CORKSPACE_VERSION:-latest}
    build:
      context: ..
      dockerfile: infra/Dockerfile.node
    command: ["pnpm", "--filter", "@corkspace/api", "exec", "tsx", "src/index.ts"]
    environment:
      <<: *app-env
      NODE_ENV: production
      API_PORT: "3000"
    volumes:
      - assets:/data/assets
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    expose:
      - "3000"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000/api/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  worker:
    image: ghcr.io/juice-de-orange/corkspace-worker:${CORKSPACE_VERSION:-latest}
    build:
      context: ..
      dockerfile: infra/Dockerfile.node
    command: ["pnpm", "--filter", "@corkspace/worker", "exec", "tsx", "src/index.ts"]
    environment:
      <<: *app-env
      NODE_ENV: production
    volumes:
      - assets:/data/assets
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

  web:
    image: ghcr.io/juice-de-orange/corkspace-web:${CORKSPACE_VERSION:-latest}
    build:
      context: ..
      dockerfile: infra/Dockerfile.web
    # Serve the app only once the api answers, so a first sign-in never meets a 502.
    depends_on:
      api:
        condition: service_healthy
    environment:
      # Which proxies may tell nginx the client address, and in which header (infra/nginx-real-ip.sh).
      TRUSTED_PROXIES: ${TRUSTED_PROXIES:-}
      REAL_IP_HEADER: ${REAL_IP_HEADER:-}
    ports:
      - "${WEB_PORT:-8080}:8080"
    volumes:
      - assets:/data/assets:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -qO /dev/null http://127.0.0.1:8080/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 6
    restart: unless-stopped

  # Synthetic demo content (a trip, a recipe, a small project) on the admin's board, without Node
  # on the host. Once, on an empty board:  docker compose --profile demo run --rm seed
  seed:
    profiles: [demo]
    image: ghcr.io/juice-de-orange/corkspace-api:${CORKSPACE_VERSION:-latest}
    build:
      context: ..
      dockerfile: infra/Dockerfile.node
    command: ["pnpm", "--filter", "@corkspace/api", "exec", "tsx", "src/seed/demo-cli.ts"]
    environment:
      SEED_URL: http://api:3000
      SEED_ORIGIN: ${BETTER_AUTH_URL}
      SEED_EMAIL: ${ADMIN_EMAIL}
      SEED_PASSWORD: ${ADMIN_PASSWORD}
    depends_on:
      api:
        condition: service_healthy
    restart: "no"

volumes:
  pgdata:
  assets:
