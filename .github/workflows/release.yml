name: release images

# On a version tag (v0.2.0, v1.0.0-rc.1, …) build the three images for linux/amd64 and linux/arm64
# and publish them to GHCR, the images infra/docker-compose.yml pulls:
#   ghcr.io/juice-de-orange/corkspace-api     (api; also runs migrations and the demo seed)
#   ghcr.io/juice-de-orange/corkspace-worker  (same build as api, run as the worker)
#   ghcr.io/juice-de-orange/corkspace-web     (nginx with the built web app)
# Tags: the version (0.2.0), major.minor (0.2) and, for releases without a pre-release suffix, latest.

on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    # Only this repository publishes: a fork that pushes the same tag has no business writing here.
    if: github.repository == 'Juice-de-Orange/corkspace'
    name: publish ${{ matrix.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: api + worker
            dockerfile: infra/Dockerfile.node
            images: |
              ghcr.io/juice-de-orange/corkspace-api
              ghcr.io/juice-de-orange/corkspace-worker
            description: Corkspace api and worker (Node 22, Hono, Better Auth, sharp)
          - name: web
            dockerfile: infra/Dockerfile.web
            images: ghcr.io/juice-de-orange/corkspace-web
            description: Corkspace web app served by unprivileged nginx
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ matrix.images }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ !contains(github.ref_name, '-') }}
          labels: |
            org.opencontainers.image.title=Corkspace
            org.opencontainers.image.description=${{ matrix.description }}
            org.opencontainers.image.licenses=MIT
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.dockerfile }}
          cache-to: type=gha,mode=max,scope=${{ matrix.dockerfile }}
