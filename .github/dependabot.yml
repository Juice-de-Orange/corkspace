# Dependency updates for every ecosystem in the repo. Minor and patch updates
# are grouped so a week produces a handful of PRs, not dozens; majors arrive one
# by one. Security updates are not affected by these limits.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: docker
    directories: [/infra]
    schedule:
      interval: weekly
    open-pull-requests-limit: 2
    ignore:
      # Node follows .nvmrc and the CI matrix; bump them together.
      - dependency-name: node
        update-types: [version-update:semver-major]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
    groups:
      actions:
        patterns: ['*']
